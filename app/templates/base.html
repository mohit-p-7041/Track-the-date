<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>{% block title %}Track the Date{% endblock %} — {{ shop_name }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="bar">
    <span class="bar-title">{{ shop_name }}</span>
    {% if user %}
      <nav class="bar-nav">
        <a href="/">Due</a>
        <a href="/scan">Scan</a>
        <a href="/products">Products</a>
        <a href="/sheet">Sheet</a>
        <a href="/settings">Settings</a>
        <a class="bar-who" href="/logout" title="Sign out">{{ user.name }}</a>
      </nav>
    {% endif %}
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
